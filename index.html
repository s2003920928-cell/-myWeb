
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的個人網站</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", sans-serif;
      background: #f4f6fb;
      color: #354052;
      line-height: 1.8;
    }

    header {
      background: #8da9d6;
      color: white;
      text-align: center;
      padding: 55px 20px;
    }

    header h1 {
      font-size: 36px;
      margin: 0;
    }

    nav {
      background: white;
      text-align: center;
      padding: 14px;
    }

    nav a {
      color: #526b96;
      text-decoration: none;
      margin: 0 14px;
      font-weight: bold;
    }

    main {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 20px;
    }

    section {
      background: white;
      padding: 25px;
      margin-bottom: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 14px #243b5310;
    }

    h2 {
      color: #6c88b8;
      margin-top: 0;
    }

    .tag {
      display: inline-block;
      background: #e8eef9;
      color: #526b96;
      padding: 6px 14px;
      margin: 5px;
      border-radius: 20px;
    }

    footer {
      text-align: center;
      background: #e5eaf4;
      padding: 20px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      header {
        padding: 35px 15px;
      }

      header h1 {
        font-size: 27px;
      }

      nav a {
        display: inline-block;
        margin: 4px 8px;
      }

      section {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>歡迎來到我的個人網站</h1>
    <p>認識自己・探索興趣・創造未來</p>
  </header>

  <nav>
    <a href="#about">關於我</a>
    <a href="#interest">我的興趣</a>
    <a href="#goal">學習目標</a>
  </nav>

  <main>
    <section id="about">
      <h2>👋 關於我</h2>
      <p>
        你好！歡迎來到我的個人網站。
        我是一位喜歡學習新事物、嘗試不同挑戰的人，
        希望透過不斷學習，讓自己變得更好。
      </p>
    </section>

    <section id="interest">
      <h2>💗 我的興趣</h2>
      <p>生活中有許多值得探索的事物，這些都是我的興趣：</p>
      <span class="tag">旅遊</span>
      <span class="tag">美食</span>
      <span class="tag">攝影</span>
      <span class="tag">探索新事物</span>
    </section>

    <section id="goal">
      <h2>✨ 我的學習目標</h2>
      <p>
        希望學習網站設計、數位行銷及資訊工具的使用，
        培養自己的創意與實作能力，
        並將所學運用在未來的工作與生活中。
      </p>
    </section>
  </main>

  <footer>
    <p>© 2026 我的個人網站 | Created with AI</p>
  </footer>
</body>
</html>
